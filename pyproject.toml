[project]
name = "cast-graph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "psycopg>=3.1",
]

[tool.vercel]
entrypoint = "api.generate:handler"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["castgraph*", "api*"]
